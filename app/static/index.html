<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Tracker</title>
<style>
  :root {
    --ink: #1f2933; --muted: #616e7c; --line: #e4e7eb; --bg: #f5f7fa; --card: #fff;
    --brand: #0b6e4f; --brand-ink: #fff; --low: #b42318; --low-bg: #fef3f2; --ok: #067647; --ok-bg: #ecfdf3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--brand); color: var(--brand-ink); padding: 20px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px; }
  .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 150px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat.low b { color: var(--low); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  button.danger { color: var(--low); }
  button:focus-visible, input:focus-visible { outline: 3px solid #84caff; outline-offset: 1px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; }
  td.actions { text-align: right; }
  td.actions button { padding: 4px 10px; margin-left: 4px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.low { color: var(--low); background: var(--low-bg); }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .msg { min-height: 24px; margin: 8px 0; font-size: 14px; }
  .msg.error { color: var(--low); }
  dialog { border: 0; border-radius: 12px; padding: 24px; width: min(420px, 92vw); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(15, 23, 42, .45); }
  dialog h2 { margin: 0 0 16px; font-size: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  label.toggle { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-weight: 500; font-size: 14px; }
  label.toggle input { width: auto; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Stock Tracker</h1>
  <p>Know what you hold and when to reorder.</p>
</header>
<main>
  <div class="stats">
    <div class="stat"><b id="stat-total">–</b><span>Items tracked</span></div>
    <div class="stat low"><b id="stat-low">–</b><span>At or below reorder level</span></div>
  </div>

  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="low-only"> Show low stock only</label>
    <button class="primary" id="add-btn" type="button">+ Add item</button>
  </div>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <div class="card">
    <table>
      <thead>
        <tr><th scope="col">Item</th><th scope="col">Quantity</th><th scope="col">Reorder level</th><th scope="col">Status</th><th scope="col">Last updated</th><th scope="col"><span class="sr-only">Actions</span></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No items yet. Click “Add item” to start.</div>
  </div>
</main>

<dialog id="dialog" aria-labelledby="dialog-title">
  <form id="form" method="dialog" novalidate>
    <h2 id="dialog-title">Add item</h2>
    <label for="f-name">Name</label>
    <input id="f-name" name="name" maxlength="100" required>
    <div class="row">
      <div><label for="f-quantity">Quantity</label><input id="f-quantity" name="quantity" type="number" min="0" step="1" required></div>
      <div><label for="f-unit">Unit</label><input id="f-unit" name="unit" maxlength="20" placeholder="pcs, kg, box" required></div>
    </div>
    <label for="f-reorder">Reorder level</label>
    <input id="f-reorder" name="reorderLevel" type="number" min="0" step="1" required>
    <p class="msg error" id="form-msg" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="cancel-btn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let editingId = null;

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.message) || `Request failed (${res.status})`);
  return data;
}

function showMessage(text, isError = false) {
  $("msg").textContent = text;
  $("msg").className = "msg" + (isError ? " error" : "");
}

function cell(text, className) {
  const td = document.createElement("td");
  td.textContent = text;  // textContent, never innerHTML: item names are user input
  if (className) td.className = className;
  return td;
}

function render(items, allItems) {
  $("stat-total").textContent = allItems.length;
  $("stat-low").textContent = allItems.filter((i) => i.quantity <= i.reorderLevel).length;
  const rows = $("rows");
  rows.replaceChildren();
  $("empty").hidden = items.length > 0;
  for (const item of items) {
    const tr = document.createElement("tr");
    const low = item.quantity <= item.reorderLevel;
    tr.append(
      cell(item.name),
      cell(`${item.quantity} ${item.unit}`, "num"),
      cell(`${item.reorderLevel} ${item.unit}`, "num"),
    );
    const status = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = "badge " + (low ? "low" : "ok");
    badge.textContent = low ? "Reorder" : "OK";
    status.append(badge);
    tr.append(status, cell(new Date(item.updatedAt).toLocaleString()));

    const actions = document.createElement("td");
    actions.className = "actions";
    const edit = document.createElement("button");
    edit.type = "button";
    edit.textContent = "Edit";
    edit.setAttribute("aria-label", `Edit ${item.name}`);
    edit.onclick = () => openForm(item);
    const del = document.createElement("button");
    del.type = "button";
    del.className = "danger";
    del.textContent = "Delete";
    del.setAttribute("aria-label", `Delete ${item.name}`);
    del.onclick = () => removeItem(item);
    actions.append(edit, del);
    tr.append(actions);
    rows.append(tr);
  }
}

async function load() {
  try {
    const all = await api("GET", "/items");
    render($("low-only").checked ? all.filter((i) => i.quantity <= i.reorderLevel) : all, all);
  } catch (err) {
    showMessage(`Could not load items: ${err.message}`, true);
  }
}

function openForm(item) {
  editingId = item ? item.itemId : null;
  $("dialog-title").textContent = item ? "Edit item" : "Add item";
  $("f-name").value = item ? item.name : "";
  $("f-quantity").value = item ? item.quantity : "";
  $("f-unit").value = item ? item.unit : "";
  $("f-reorder").value = item ? item.reorderLevel : "";
  $("form-msg").textContent = "";
  $("dialog").showModal();
  $("f-name").focus();
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const toInt = (v) => (v.trim() === "" ? NaN : Number(v));
  const body = {
    name: $("f-name").value,
    quantity: toInt($("f-quantity").value),
    unit: $("f-unit").value,
    reorderLevel: toInt($("f-reorder").value),
  };
  if (!Number.isInteger(body.quantity) || !Number.isInteger(body.reorderLevel)) {
    $("form-msg").textContent = "Quantity and reorder level must be whole numbers.";
    return;
  }
  try {
    if (editingId) await api("PUT", `/items/${encodeURIComponent(editingId)}`, body);
    else await api("POST", "/items", body);
    $("dialog").close();
    showMessage(`Saved “${body.name.trim()}”.`);
    load();
  } catch (err) {
    $("form-msg").textContent = err.message;  // server-side validation message
  }
});

async function removeItem(item) {
  if (!confirm(`Delete “${item.name}”? This cannot be undone.`)) return;
  try {
    await api("DELETE", `/items/${encodeURIComponent(item.itemId)}`);
    showMessage(`Deleted “${item.name}”.`);
    load();
  } catch (err) {
    showMessage(`Could not delete: ${err.message}`, true);
  }
}

$("add-btn").onclick = () => openForm(null);
$("cancel-btn").onclick = () => $("dialog").close();
$("low-only").onchange = load;
load();
</script>
</body>
</html>
