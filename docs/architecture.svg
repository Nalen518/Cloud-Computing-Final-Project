<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" width="1120" height="730" font-family="Arial, Helvetica, sans-serif">
  <title>Small Business Stock Tracker: Track C serverless architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="iam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DD344C"/></marker>
    <marker id="log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E7157B"/></marker>
  </defs>
  <rect width="1120" height="730" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#232F3E">Small Business Stock Tracker: Track C serverless architecture</text>
  <text x="30" y="60" font-size="13" fill="#545B64">One entity (Item) · four CRUD endpoints · AWS Academy lab account · no VPC</text>

  <!-- AWS Cloud boundary -->
  <rect x="250" y="80" width="850" height="452" rx="6" fill="#F7F8F8" stroke="#232F3E" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="266" y="104" font-size="13" font-weight="bold" fill="#232F3E">AWS Cloud · one region, noted at lab start (e.g. us-east-1)</text>

  <!-- Client -->
  <g text-anchor="middle">
    <rect x="30" y="150" width="180" height="150" rx="6" fill="#FFFFFF" stroke="#545B64" stroke-width="1.5"/>
    <rect x="30" y="150" width="180" height="34" rx="6" fill="#545B64"/>
    <text x="120" y="172" font-size="13" font-weight="bold" fill="#FFFFFF">Client</text>
    <text x="120" y="222" font-size="12" fill="#232F3E">Owner or staff</text>
    <text x="120" y="240" font-size="12" fill="#232F3E">curl or Postman</text>
    <text x="120" y="270" font-size="11" fill="#545B64">(no UI at this stage)</text>

    <!-- API Gateway -->
    <rect x="300" y="150" width="240" height="150" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.5"/>
    <rect x="300" y="150" width="240" height="34" rx="6" fill="#8C4FFF"/>
    <text x="420" y="172" font-size="13" font-weight="bold" fill="#FFFFFF">Amazon API Gateway</text>
    <text x="420" y="222" font-size="12" fill="#232F3E">REST API, stage: dev</text>
    <text x="420" y="240" font-size="12" fill="#232F3E">/items · /items/{itemId}</text>
    <text x="420" y="270" font-size="12" fill="#232F3E">API key + usage plan</text>
    <text x="420" y="288" font-size="12" fill="#232F3E">throttling on the stage</text>

    <!-- Lambda -->
    <rect x="610" y="150" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.5"/>
    <rect x="610" y="150" width="200" height="34" rx="6" fill="#ED7100"/>
    <text x="710" y="172" font-size="13" font-weight="bold" fill="#FFFFFF">AWS Lambda</text>
    <text x="710" y="222" font-size="12" fill="#232F3E">items-handler (Python)</text>
    <text x="710" y="240" font-size="12" fill="#232F3E">routes by HTTP method</text>
    <text x="710" y="270" font-size="12" fill="#232F3E">env: TABLE_NAME</text>
    <text x="710" y="288" font-size="12" fill="#232F3E">128 MB memory</text>

    <!-- DynamoDB -->
    <rect x="880" y="150" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#3B48CC" stroke-width="1.5"/>
    <rect x="880" y="150" width="200" height="34" rx="6" fill="#3B48CC"/>
    <text x="980" y="172" font-size="13" font-weight="bold" fill="#FFFFFF">Amazon DynamoDB</text>
    <text x="980" y="222" font-size="12" fill="#232F3E">SmallBusinessItems</text>
    <text x="980" y="240" font-size="12" fill="#232F3E">PK: itemId (String)</text>
    <text x="980" y="270" font-size="12" fill="#232F3E">on-demand capacity</text>
    <text x="980" y="288" font-size="12" fill="#232F3E">encrypted at rest</text>

    <!-- CloudWatch Logs -->
    <rect x="300" y="360" width="240" height="90" rx="6" fill="#FFFFFF" stroke="#E7157B" stroke-width="1.5"/>
    <rect x="300" y="360" width="240" height="34" rx="6" fill="#E7157B"/>
    <text x="420" y="382" font-size="13" font-weight="bold" fill="#FFFFFF">Amazon CloudWatch Logs</text>
    <text x="420" y="418" font-size="12" fill="#232F3E">/aws/lambda/items-handler</text>
    <text x="420" y="436" font-size="12" fill="#232F3E">one log entry per request</text>

    <!-- IAM LabRole -->
    <rect x="610" y="360" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#DD344C" stroke-width="1.5"/>
    <rect x="610" y="360" width="200" height="34" rx="6" fill="#DD344C"/>
    <text x="710" y="382" font-size="13" font-weight="bold" fill="#FFFFFF">AWS IAM: LabRole</text>
    <text x="710" y="418" font-size="12" fill="#232F3E">preset lab role</text>
    <text x="710" y="436" font-size="12" fill="#232F3E">Lambda execution role</text>
  </g>

  <!-- Request path (solid, left to right) -->
  <g stroke="#232F3E" stroke-width="2" fill="none">
    <line x1="210" y1="205" x2="298" y2="205" marker-end="url(#a)"/>
    <line x1="540" y1="205" x2="608" y2="205" marker-end="url(#a)"/>
    <line x1="810" y1="205" x2="878" y2="205" marker-end="url(#a)"/>
    <!-- Response path (solid, right to left) -->
    <line x1="880" y1="255" x2="812" y2="255" marker-end="url(#a)"/>
    <line x1="610" y1="255" x2="542" y2="255" marker-end="url(#a)"/>
    <line x1="300" y1="255" x2="212" y2="255" marker-end="url(#a)"/>
  </g>
  <text x="254" y="190" font-size="10" fill="#232F3E" text-anchor="middle" font-weight="bold">HTTPS</text>

  <!-- Step badges -->
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#232F3E">
    <circle cx="254" cy="205" r="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/><text x="254" y="209">1</text>
    <circle cx="574" cy="205" r="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/><text x="574" y="209">2</text>
    <circle cx="844" cy="205" r="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/><text x="844" y="209">3</text>
    <circle cx="844" cy="255" r="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/><text x="844" y="259">4</text>
    <circle cx="574" cy="255" r="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/><text x="574" y="259">5</text>
    <circle cx="254" cy="255" r="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.5"/><text x="254" y="259">6</text>
  </g>

  <!-- Logging (dashed pink): Lambda writes to CloudWatch -->
  <polyline points="650,300 650,330 420,330 420,358" fill="none" stroke="#E7157B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#log)"/>
  <text x="535" y="324" font-size="11" fill="#E7157B" text-anchor="middle">writes logs</text>

  <!-- IAM (dashed red): Lambda assumes LabRole; LabRole allows table access -->
  <line x1="760" y1="360" x2="760" y2="302" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#iam)"/>
  <text x="768" y="336" font-size="11" fill="#DD344C">assumed by Lambda</text>
  <polyline points="810,415 980,415 980,302" fill="none" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#iam)"/>
  <text x="895" y="408" font-size="11" fill="#DD344C" text-anchor="middle">allows item read/write</text>

  <!-- Security notes inside the cloud -->
  <text x="266" y="482" font-size="12" font-weight="bold" fill="#232F3E">Security</text>
  <text x="266" y="500" font-size="12" fill="#232F3E">HTTPS only · API key + usage-plan throttling · DynamoDB encrypted at rest · no VPC (managed services over HTTPS)</text>
  <text x="266" y="516" font-size="12" fill="#545B64">LabRole is broader than least privilege (lab limit); a real deployment would use a role scoped to this table and its logs.</text>

  <!-- Request flow -->
  <text x="30" y="562" font-size="14" font-weight="bold" fill="#232F3E">Request flow</text>
  <g font-size="12" fill="#232F3E">
    <text x="30" y="584">1  Client sends an HTTPS request with the x-api-key header</text>
    <text x="30" y="602">2  API Gateway checks the key and throttle, then invokes Lambda (proxy integration)</text>
    <text x="30" y="620">3  Lambda validates input and calls PutItem / GetItem / UpdateItem / DeleteItem</text>
    <text x="30" y="638">4  DynamoDB returns the item or the result</text>
    <text x="30" y="656">5  Lambda returns a status code and a JSON body</text>
    <text x="30" y="674">6  API Gateway returns 201 / 200 / 204 / 400 / 404 to the client</text>
  </g>

  <!-- Endpoints -->
  <text x="640" y="562" font-size="14" font-weight="bold" fill="#232F3E">CRUD endpoints (entity: Item)</text>
  <g font-size="12" fill="#232F3E" font-family="Consolas, 'Courier New', monospace">
    <text x="640" y="584">POST   /items            → 201 | 400</text>
    <text x="640" y="602">GET    /items/{itemId}   → 200 | 404</text>
    <text x="640" y="620">PUT    /items/{itemId}   → 200 | 400 | 404</text>
    <text x="640" y="638">DELETE /items/{itemId}   → 204 | 404</text>
    <text x="640" y="656" fill="#545B64">stretch: GET /items?lowStock=true (scan)</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#232F3E">
    <line x1="30" y1="708" x2="70" y2="708" stroke="#232F3E" stroke-width="2"/><text x="78" y="712">request / response</text>
    <line x1="220" y1="708" x2="260" y2="708" stroke="#DD344C" stroke-width="1.8" stroke-dasharray="6 4"/><text x="268" y="712">IAM permission</text>
    <line x1="390" y1="708" x2="430" y2="708" stroke="#E7157B" stroke-width="1.8" stroke-dasharray="6 4"/><text x="438" y="712">logging</text>
  </g>
</svg>
